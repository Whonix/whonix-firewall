name: Firewall Dry-Run Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run-tests:
    ## CI runs only where we enabled it. Unset variable -> the job is
    ## skipped, no runner is allocated, and the run stays green: upstream
    ## and forks are never handed a red X for a lane they did not opt into.
    ## A fork that WANTS our CI sets the same variable in its own repo.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    name: Dry-run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install genmkfile + helper-scripts
        uses: org-ai-assisted/developer-meta-files/.github/actions/install-deps@master

      - name: Run dry-run test suite
        run: sudo --preserve-env=CI ./tests/test_firewall_dry_run.sh ./test-output

      - name: Upload generated nft scripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nft-scripts
          path: test-output/
          retention-days: 30

  nft-diff:
    name: Diff nft rules vs base branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    ## CI runs only where we enabled it; ANDed with the existing guard.
    ## Unset variable -> skipped, no runner, run stays green.
    if: >-
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
      && (github.event_name == 'pull_request')
    steps:
      - name: Install genmkfile + helper-scripts
        uses: org-ai-assisted/developer-meta-files/.github/actions/install-deps@master

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: pr

      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Generate nft scripts from base branch
        run: |
          cd base
          sudo --preserve-env=CI ./tests/test_firewall_dry_run.sh ./test-output-base 2>&1 || true

      - name: Generate nft scripts from PR branch
        run: |
          cd pr
          sudo --preserve-env=CI ./tests/test_firewall_dry_run.sh ./test-output-pr 2>&1 || true

      - name: Diff base vs PR nft scripts
        run: |
          echo "============================================="
          echo "nftables rule diff: base vs PR"
          echo "============================================="
          has_diff=0
          for f in pr/test-output-pr/*.nft; do
            name="$(basename "$f")"
            base_f="base/test-output-base/${name}"
            if [ ! -f "$base_f" ]; then
              echo "NEW: ${name} (no baseline)"
              continue
            fi
            if ! diff -u "$base_f" "$f" > "/tmp/diff-${name}" 2>&1; then
              has_diff=1
              echo ""
              echo "--- CHANGED: ${name} ---"
              cat "/tmp/diff-${name}"
            else
              echo "UNCHANGED: ${name}"
            fi
          done
          for f in base/test-output-base/*.nft; do
            name="$(basename "$f")"
            if [ ! -f "pr/test-output-pr/${name}" ]; then
              has_diff=1
              echo "REMOVED: ${name}"
            fi
          done
          echo ""
          if [ "$has_diff" -eq 0 ]; then
            echo "No nftables rule changes detected."
          else
            echo "nftables rule changes detected. Review diffs above."
          fi

      - name: Upload diff artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nft-diff
          path: |
            base/test-output-base/
            pr/test-output-pr/
          retention-days: 30
